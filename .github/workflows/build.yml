
name: Build Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install Rokit
        run: curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash

      - name: Install tools
        run: |
          export PATH="$HOME/.rokit/bin:$PATH"
          rokit install --no-trust-check

      - name: Build TypeScript
        run: npm run build

      - name: Assemble Roblox Place
        run: |
          export PATH="$HOME/.rokit/bin:$PATH"
          lune run lune/assemble.luau ./default.project.json

      - name: Upload Roblox Place
        uses: actions/upload-artifact@v4
        with:
          name: place-rbxl
          path: place.rbxl
          if-no-files-found: error
